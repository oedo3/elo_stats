[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elo-stats"
version = "0.2.0"
description = "Game-by-game player Elo ratings for the NBA, served over a small FastAPI backend."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "nba_api>=1.10",
  # nba_api needs pandas, but its DataFrame helpers break on pandas 3.
  # We only use the raw JSON, so pin to the last line nba_api supports.
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
elo-stats-ingest = "elo_stats.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
